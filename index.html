<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LEDBOX 대형 전광판 자동견적</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--bd:#e7e9ee;--tx:#111827;--mut:#6b7280;--sh:0 10px 25px rgba(0,0,0,.06);--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1240px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--bd);font-size:16px}
.card .c{padding:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:#fff}
.hint{font-size:12px;color:var(--mut);line-height:1.45}
.preview{position:relative;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--bd);overflow:hidden;background:#0b0f17}
.bg{position:absolute;inset:0;background:
radial-gradient(1200px 520px at 50% 25%, rgba(255,255,255,.10), transparent 60%),
linear-gradient(135deg,#0b0f17,#06070a)}
.brand{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);display:flex;gap:12px;align-items:center;opacity:.92}
.brand .mark{width:54px;height:38px;border-radius:10px;background:linear-gradient(135deg,#334155,#111827);border:1px solid rgba(255,255,255,.15)}
.brand .name{font-weight:900;letter-spacing:.5px;color:#cbd5e1;font-size:38px}
.bar{position:absolute;left:50%;top:45%;transform:translateX(-50%);width:360px;height:6px;border-radius:6px;background:linear-gradient(90deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7);opacity:.9}
.screen{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35);background:rgba(239,68,68,.20)}
.dim{position:absolute;left:12px;bottom:10px;font-size:12px;color:#e5e7eb;background:rgba(0,0,0,.35);padding:6px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--bd);font-size:13px}
.tbl th{width:34%;background:#fafafa;color:#374151;text-align:left}
.price{padding:14px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.pTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.pTop .t{font-size:12px;color:var(--mut)}
.pTop .v{font-size:22px;font-weight:900}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 14px;font-weight:800;border:1px solid var(--bd);background:#fff;color:#111;text-decoration:none;cursor:pointer}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
#quoteModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
#quoteModal .box{width:520px;max-width:92vw;background:#fff;border-radius:16px;border:1px solid var(--bd);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#quoteModal header{padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:900}
#quoteModal .b{padding:16px}
#quoteModal .a{display:flex;gap:10px;justify-content:flex-end;padding:14px 16px;border-top:1px solid var(--bd)}
#quotePrintArea{display:none}
@media print{body *{visibility:hidden}#quotePrintArea,#quotePrintArea *{visibility:visible}#quotePrintArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="card">
      <h2>대형 전광판 미리보기</h2>
      <div class="c">
        <div class="preview" id="preview">
          <div class="bg"></div>
          <div class="brand"><div class="mark"></div><div class="name">LEDBOX</div></div>
          <div class="bar"></div>
          <div class="screen" id="screen"></div>
          <div class="dim" id="dim">가로 - / 세로 -</div>
        </div>
        <p class="hint" style="margin:10px 0 0 0">※ 실제 측정한 가로/세로와 시청거리(최소)를 입력하면 피치를 추천합니다.</p>
      </div>
    </div>

    <div class="card">
      <h2>1. 사이즈 선택</h2>
      <div class="c">
        <p class="hint" style="margin-top:0">mm 또는 m 중 편한 단위를 입력하세요(서로 자동 동기화).</p>
        <div class="row">
          <div><label>가로 (mm)</label><input id="w_mm" type="number" min="1" step="1" placeholder="예: 3000"></div>
          <div><label>세로 (mm)</label><input id="h_mm" type="number" min="1" step="1" placeholder="예: 1500"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label>가로 (m)</label><input id="w_m" type="number" min="0" step="0.01" placeholder="예: 3.00"></div>
          <div><label>세로 (m)</label><input id="h_m" type="number" min="0" step="0.01" placeholder="예: 1.50"></div>
        </div>

        <div class="row" style="margin-top:10px">
          <div>
            <label>2. 시청거리 (최소, m)</label>
            <input id="view_m" type="number" min="0" step="0.1" placeholder="예: 10">
            <div class="hint">※ 시청거리가 짧을수록 더 높은 해상도(작은 피치)가 필요합니다.</div>
          </div>
          <div>
            <label>해상도 선택</label>
            <select id="pitchMode">
              <option value="auto" selected>자동 추천</option>
              <option value="manual">수동 선택</option>
            </select>
            <div style="margin-top:10px">
              <label>피치(해상도)</label>
              <select id="pitchSelect" disabled></select>
            </div>
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <div><label>3. 옵션 - 전원</label><select id="powerSelect"></select></div>
          <div><label>3. 옵션 - 컨트롤</label><select id="ctrlSelect"></select></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label>3. 옵션 - 설치방식</label><select id="installSelect"></select></div>
          <div><label>비고</label><input id="memo" placeholder="예: 설치 위치/요청사항"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>맞춤 전광판</h2>
      <div class="c">
        <table class="tbl">
          <tr><th>피치</th><td id="out_pitch">-</td></tr>
          <tr><th>사이즈</th><td id="out_size">-</td></tr>
          <tr><th>권장 시청거리</th><td id="out_view">-</td></tr>
          <tr><th>해상도</th><td id="out_res">-</td></tr>
          <tr><th>전원</th><td id="out_power">-</td></tr>
          <tr><th>컨트롤</th><td id="out_ctrl">-</td></tr>
          <tr><th>설치</th><td id="out_install">-</td></tr>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>가격 및 버튼</h2>
      <div class="c">
        <div class="price">
          <div class="pTop"><div><div class="t">가격</div><div class="v" id="out_price">-</div></div></div>
          <div class="hint" style="margin-top:8px">배송비: 문의 / VAT: 별도(정책에 맞게 수정)</div>
        </div>
        <div class="btns">
          <a class="btn primary" id="btnOrder" href="#" aria-disabled="true">빠른 주문하기</a>
          <button class="btn" id="btnPrint" type="button">견적서 출력</button>
          <a class="btn" id="btnInquiry" href="https://ledbox.co.kr/board/qa">문의</a>
          <a class="btn" id="btnBrowse" href="https://ledbox.co.kr/product/list.html">제품 둘러보기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="quoteModal" role="dialog" aria-modal="true" aria-label="고객 정보 입력">
  <div class="box">
    <header>고객 정보 입력</header>
    <div class="b">
      <div class="row">
        <div><label>회사명</label><input id="custCompany" placeholder="회사명"></div>
        <div><label>담당자</label><input id="custName" placeholder="담당자"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>연락처</label><input id="custTel" placeholder="010-0000-0000"></div>
        <div><label>이메일</label><input id="custEmail" placeholder="example@domain.com"></div>
      </div>
      <div style="margin-top:10px"><label>주소</label><input id="custAddr" placeholder="주소(선택)"></div>
    </div>
    <div class="a">
      <button class="btn" type="button" id="btnModalCancel">취소</button>
      <button class="btn primary" type="button" id="btnModalMake">견적서 생성</button>
    </div>
  </div>
</div>

<div id="quotePrintArea"></div>

<script>
/* ===== CONFIG ===== */
const PITCHES = [
  { id:"P3",  mm:3,  label:"P3 (고해상도)", price_per_m2:3400000 },
  { id:"P4",  mm:4,  label:"P4 (고해상도)", price_per_m2:2600000 },
  { id:"P5",  mm:5,  label:"P5 (일반)",     price_per_m2:2100000 },
  { id:"P6",  mm:6,  label:"P6 (일반)",     price_per_m2:1850000 },
  { id:"P8",  mm:8,  label:"P8 (중거리)",   price_per_m2:1600000 },
  { id:"P10", mm:10, label:"P10 (원거리)",  price_per_m2:1450000 },
];
const OPTIONS = {
  power:[{id:"220v",label:"220V (기본)"},{id:"3p",label:"삼상전원 (별도)"}],
  ctrl:[{id:"remote",label:"무선 리모컨 (기본)"},{id:"pc",label:"PC 제어 (옵션)"}],
  install:[{id:"wall",label:"벽부착 (기본)"},{id:"stand",label:"스탠드/거치 (옵션)"},{id:"hanging",label:"천장 행잉 (옵션)"}],
};
// 사이즈/피치별 빠른주문 링크 테이블(원하는대로 채우기)
const ORDER_LINK_TABLE = {
  // "P10:3000x1500": "https://ledbox.co.kr/order/p10-3000x1500",
};

/* ===== STATE ===== */
const state = { w_mm:null,h_mm:null,view_m:null,pitchMode:"auto",pitchId:null,powerId:"220v",ctrlId:"remote",installId:"wall" };
const el = (id)=>document.getElementById(id);
const toNum = (v)=>{ const n=Number(v); return Number.isFinite(n)&&n>0 ? n : null; };
const mmFromM = (m)=>Math.round(m*1000);
const fmtMm = (mm)=>mm?mm.toLocaleString("ko-KR"):"-";
const fmtKRW = (n)=>Number.isFinite(n)?(n.toLocaleString("ko-KR")+"원"):"-";

/* ===== LOGIC ===== */
function pitchByView(view_m){
  if(!view_m) return null;
  const target = view_m * 0.8; // 여유
  const sorted=[...PITCHES].sort((a,b)=>a.mm-b.mm);
  let chosen = sorted[0];
  for(const p of sorted){ if(p.mm<=target) chosen=p; }
  return chosen.id;
}
function resolution(wmm,hmm,pmm){
  return {w:Math.max(1,Math.round(wmm/pmm)), h:Math.max(1,Math.round(hmm/pmm))};
}
function calcPrice(){
  if(!state.w_mm||!state.h_mm||!state.pitchId) return null;
  const p=PITCHES.find(x=>x.id===state.pitchId); if(!p) return null;
  const area=(state.w_mm/1000)*(state.h_mm/1000);
  let mult=1.0;
  if(state.ctrlId==="pc") mult+=0.05;
  if(state.installId==="stand") mult+=0.06;
  if(state.installId==="hanging") mult+=0.08;
  if(state.powerId==="3p") mult+=0.03;
  return Math.round(area*p.price_per_m2*mult/1000)*1000;
}
function orderKey(){
  if(!state.pitchId||!state.w_mm||!state.h_mm) return null;
  return `${state.pitchId}:${state.w_mm}x${state.h_mm}`;
}
function applyOrderLink(){
  const btn=el("btnOrder");
  const key=orderKey();
  const url=key?ORDER_LINK_TABLE[key]:null;
  if(url){ btn.href=url; btn.setAttribute("aria-disabled","false"); }
  else { btn.href="#"; btn.setAttribute("aria-disabled","true"); }
}
function updateOverlay(){
  const box=el("preview");
  const screen=el("screen");
  const dim=el("dim");
  const w=state.w_mm||3200, h=state.h_mm||1800;
  const maxW=box.clientWidth*0.78;
  const maxH=box.clientHeight*0.52;
  const s=Math.min(maxW/w,maxH/h);
  screen.style.width=Math.max(120,Math.round(w*s))+"px";
  screen.style.height=Math.max(60,Math.round(h*s))+"px";
  dim.textContent=`가로 ${state.w_mm?fmtMm(state.w_mm):"-"}mm / 세로 ${state.h_mm?fmtMm(state.h_mm):"-"}mm`;
}
function initSelect(id,items){
  el(id).innerHTML = items.map(x=>`<option value="${x.id}">${x.label}</option>`).join("");
}
function render(){
  el("out_pitch").textContent = state.pitchId || "-";
  el("out_size").textContent = (state.w_mm&&state.h_mm)?`가로 ${fmtMm(state.w_mm)} × 세로 ${fmtMm(state.h_mm)} (mm)`:"-";
  el("out_view").textContent = state.view_m?`최소 ${state.view_m}m (권장: ${Math.max(1,Math.round(state.view_m*1.3))}m+)`:"-";
  const p=PITCHES.find(x=>x.id===state.pitchId);
  if(p && state.w_mm && state.h_mm){
    const r=resolution(state.w_mm,state.h_mm,p.mm);
    el("out_res").textContent=`${r.w.toLocaleString("ko-KR")} × ${r.h.toLocaleString("ko-KR")} px`;
  }else el("out_res").textContent="-";
  el("out_power").textContent = OPTIONS.power.find(x=>x.id===state.powerId)?.label||"-";
  el("out_ctrl").textContent = OPTIONS.ctrl.find(x=>x.id===state.ctrlId)?.label||"-";
  el("out_install").textContent = OPTIONS.install.find(x=>x.id===state.installId)?.label||"-";
  const price=calcPrice();
  el("out_price").textContent = price?fmtKRW(price):"문의";
  updateOverlay();
  applyOrderLink();
}

/* ===== SIZE SYNC ===== */
function sync(from){
  const wmm=toNum(el("w_mm").value), hmm=toNum(el("h_mm").value);
  const wm=toNum(el("w_m").value), hm=toNum(el("h_m").value);
  if(from==="mm"){
    if(wmm) el("w_m").value=(wmm/1000).toFixed(2);
    if(hmm) el("h_m").value=(hmm/1000).toFixed(2);
  }else{
    if(wm) el("w_mm").value=mmFromM(wm);
    if(hm) el("h_mm").value=mmFromM(hm);
  }
}
function recompute(){
  state.w_mm = toNum(el("w_mm").value) || (toNum(el("w_m").value)?mmFromM(toNum(el("w_m").value)):null);
  state.h_mm = toNum(el("h_mm").value) || (toNum(el("h_m").value)?mmFromM(toNum(el("h_m").value)):null);
  state.view_m = toNum(el("view_m").value);
  state.pitchMode = el("pitchMode").value;
  state.powerId = el("powerSelect").value;
  state.ctrlId = el("ctrlSelect").value;
  state.installId = el("installSelect").value;

  if(state.pitchMode==="auto"){
    el("pitchSelect").disabled=true;
    state.pitchId = pitchByView(state.view_m) || state.pitchId || "P10";
  }else{
    el("pitchSelect").disabled=false;
    state.pitchId = el("pitchSelect").value || state.pitchId || "P6";
  }
  el("pitchSelect").value = state.pitchId;
  render();
}

/* ===== QUOTE PRINT ===== */
function openQuoteModal(){ el("quoteModal").style.display="flex"; }
function closeQuoteModal(){ el("quoteModal").style.display="none"; }
function nowKST(){ return new Date().toLocaleString("ko-KR",{timeZone:"Asia/Seoul"}); }
function quoteNo(){ const d=new Date(); return `LBOX-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(d.getTime()).slice(-6)}`; }
function buildPrint(){
  const supplier = {
    company1:"엘이디박스",
    company2:"(주)미라클이앤아이 나주지사",
    ceo:"김민경",
    biz:"572-85-02529",
    tel:"010-4522-2320",
    email:"7952320@naver.com",
    addr:"전남 나주시 교육길13(빛가람동) 스마트파크지식산업센터 D2동310호"
  };
  const cust = {
    company: el("custCompany").value||"-",
    name: el("custName").value||"-",
    tel: el("custTel").value||"-",
    email: el("custEmail").value||"-",
    addr: el("custAddr").value||"-",
  };
  if(!state.w_mm||!state.h_mm){ alert("가로/세로를 먼저 입력해 주세요."); return; }
  if(!state.pitchId){ alert("피치를 선택할 수 없습니다. 시청거리 또는 수동 선택을 확인해 주세요."); return; }
  const p=PITCHES.find(x=>x.id===state.pitchId);
  const price=calcPrice();
  const area=(state.w_mm/1000)*(state.h_mm/1000);
  const res=p?resolution(state.w_mm,state.h_mm,p.mm):null;
  const memo=el("memo").value||"-";
  el("quotePrintArea").innerHTML = `
  <div style="padding:16mm;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;color:#111;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
      <div><div style="font-size:22px;font-weight:900;">견 적 서</div><div style="color:#6b7280;font-size:12px;margin-top:4px;">LEDBOX 대형 전광판 자동견적</div></div>
      <div style="text-align:right;font-size:12px;color:#374151;line-height:1.6;">
        <div>견적번호: <b>${quoteNo()}</b></div>
        <div>발행일시: ${nowKST()}</div>
      </div>
    </div>

    <div style="margin-top:10mm;display:grid;grid-template-columns:1fr 1fr;gap:10mm;">
      <div style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;">
        <div style="font-weight:900;margin-bottom:6px;">공급자</div>
        <div style="font-size:12px;line-height:1.7;">
          ${supplier.company1} ${supplier.company2}<br/>
          대표자: ${supplier.ceo}<br/>
          사업자번호: ${supplier.biz}<br/>
          전화: ${supplier.tel}<br/>
          이메일: ${supplier.email}<br/>
          주소: ${supplier.addr}
        </div>
      </div>
      <div style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;">
        <div style="font-weight:900;margin-bottom:6px;">수신자(고객)</div>
        <div style="font-size:12px;line-height:1.7;">
          회사명: ${cust.company}<br/>
          담당자: ${cust.name}<br/>
          연락처: ${cust.tel}<br/>
          이메일: ${cust.email}<br/>
          주소: ${cust.addr}
        </div>
      </div>
    </div>

    <div style="margin-top:10mm;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <tr><th style="background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;width:28%;">항목</th>
            <th style="background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;">내용</th></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">피치</td><td style="border-bottom:1px solid #eee;padding:10px;">${state.pitchId}</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">사이즈</td><td style="border-bottom:1px solid #eee;padding:10px;">가로 ${fmtMm(state.w_mm)} × 세로 ${fmtMm(state.h_mm)} (mm)</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">면적</td><td style="border-bottom:1px solid #eee;padding:10px;">${area.toFixed(2)} ㎡</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">해상도</td><td style="border-bottom:1px solid #eee;padding:10px;">${res?res.w.toLocaleString("ko-KR")+" × "+res.h.toLocaleString("ko-KR")+" px":"-"}</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">시청거리</td><td style="border-bottom:1px solid #eee;padding:10px;">최소 ${state.view_m?state.view_m+"m":"-"} (권장: ${state.view_m?Math.max(1,Math.round(state.view_m*1.3))+"m+":"-"})</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">전원</td><td style="border-bottom:1px solid #eee;padding:10px;">${OPTIONS.power.find(x=>x.id===state.powerId)?.label||"-"}</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">컨트롤</td><td style="border-bottom:1px solid #eee;padding:10px;">${OPTIONS.ctrl.find(x=>x.id===state.ctrlId)?.label||"-"}</td></tr>
        <tr><td style="border-bottom:1px solid #eee;padding:10px;">설치</td><td style="border-bottom:1px solid #eee;padding:10px;">${OPTIONS.install.find(x=>x.id===state.installId)?.label||"-"}</td></tr>
        <tr><td style="padding:10px;">비고</td><td style="padding:10px;">${memo}</td></tr>
      </table>
    </div>

    <div style="margin-top:10mm;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;">
      <div style="font-size:12px;color:#6b7280;line-height:1.7;">
        • 본 견적은 참고용 자동 산출값입니다. 실제 금액은 옵션/설치 환경/물류 조건에 따라 달라질 수 있습니다.<br/>
        • 배송비/VAT는 별도입니다. 최종 발주 전 상담을 통해 사양 확정을 권장합니다.
      </div>
      <div style="min-width:240px;border:1px solid #e5e7eb;border-radius:10px;padding:12px;">
        <div style="color:#6b7280;font-size:12px;">금액</div>
        <div style="font-size:22px;font-weight:900;">${price?fmtKRW(price):"문의"}</div>
      </div>
    </div>
  </div>`;
  el("quotePrintArea").style.display="block";
  closeQuoteModal();
  setTimeout(()=>window.print(),250);
}

/* ===== INIT ===== */
document.addEventListener("DOMContentLoaded", ()=>{
  initSelect("powerSelect", OPTIONS.power);
  initSelect("ctrlSelect", OPTIONS.ctrl);
  initSelect("installSelect", OPTIONS.install);
  el("pitchSelect").innerHTML=PITCHES.map(p=>`<option value="${p.id}">${p.label}</option>`).join("");
  el("pitchSelect").value="P10";

  el("w_mm").addEventListener("input",()=>{sync("mm");recompute();});
  el("h_mm").addEventListener("input",()=>{sync("mm");recompute();});
  el("w_m").addEventListener("input",()=>{sync("m");recompute();});
  el("h_m").addEventListener("input",()=>{sync("m");recompute();});
  el("view_m").addEventListener("input",recompute);
  el("pitchMode").addEventListener("change",recompute);
  el("pitchSelect").addEventListener("change",()=>{state.pitchId=el("pitchSelect").value;render();});
  el("powerSelect").addEventListener("change",recompute);
  el("ctrlSelect").addEventListener("change",recompute);
  el("installSelect").addEventListener("change",recompute);

  el("btnPrint").addEventListener("click",openQuoteModal);
  el("btnModalCancel").addEventListener("click",closeQuoteModal);
  el("btnModalMake").addEventListener("click",buildPrint);

  // first render
  recompute();
});
</script>
</body>
</html>
